<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store impact</title>
<style>
  /* Wrapper so Looker Studio can show the Apps Script impact app:
     Looker blocks script.google.com in its URL embed, but allows this page, and this page frames the app. */
  html, body { margin: 0; height: 100%; background: #fff; font: 13px Roboto, Arial, sans-serif; color: #5f6368; }
  iframe { border: 0; width: 100%; height: 100%; display: block; }
  .msg { padding: 16px; }
</style>
</head>
<body>
<script>
  // The app link comes in the address: index.html?app=<the Apps Script /exec link, URL-encoded>
  // Only Apps Script links are accepted, so this page can't be used to frame anything else.
  const app = new URLSearchParams(location.search).get('app') || '';
  if (/^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[\w-]+\/(exec|dev)(\?.*)?$/.test(app)) {
    const f = document.createElement('iframe');
    f.src = app;
    f.title = 'Store impact for next week';
    f.allow = 'clipboard-write';
    document.body.appendChild(f);
  } else {
    document.body.innerHTML = '<div class="msg">Impact app link missing. Ask Omar to check the Looker embed URL.</div>';
  }
</script>
</body>
</html>
